<!DOCTYPE html>
<html lang="zh" data-bs-theme="dark">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>工具 - Octavia</title>
    <link rel="icon" href="/favicon.ico" />
    <link rel="stylesheet" href="/lib/bootstrap.min.css" />
    <link rel="stylesheet" href="/lib/font.css" />
    <script src="/lib/common.js"></script>
    <style>
        .result-box {
            font-family: monospace;
            font-size: 0.85rem;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 260px;
            overflow-y: auto;
        }
    </style>
</head>

<body class="d-flex flex-column min-vh-100">
    <header>
        <nav class="navbar bg-body-tertiary">
            <div class="container-fluid">
                <a href="/" class="navbar-brand mb-0 h1">欧科塔维亚</a>
                <div class="d-flex align-items-center gap-2">
                    <a href="/index.html" class="btn btn-outline-secondary btn-sm" rel="noopener">奇域查询</a>
                    <a href="/database.html" class="btn btn-outline-secondary btn-sm" target="_blank" rel="noopener">奇域数据库</a>
                </div>
            </div>
        </nav>
    </header>

    <main class="container mt-4 mb-5" style="max-width: 800px;">
        <div class="card mb-4">
            <div class="card-header"><h5 class="mb-0">枚举作者奇域</h5></div>
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-12">
                        <label class="form-label">UID 或 GUID</label>
                        <input id="enumInput" type="text" inputmode="numeric" class="form-control font-monospace"
                            placeholder="自动识别 UID / guid" />
                        <div id="enumPreview" class="form-text"></div>
                    </div>
                    <div class="col-6 col-md-3">
                        <label class="form-label">seq 起始</label>
                        <input id="enumSeqStart" type="number" min="1" class="form-control" value="1" />
                    </div>
                    <div class="col-6 col-md-3">
                        <label class="form-label">seq 结束</label>
                        <input id="enumSeqEnd" type="number" min="1" class="form-control" value="20" />
                    </div>
                </div>
                <button class="btn btn-primary mt-3" onclick="enumerateAuthorStages()">生成并打开查询</button>
                <div id="enumResult" class="mt-3"></div>
            </div>
        </div>
    </main>

    <footer class="mt-auto mb-3">
        <p class="text-center"><a href="/settings.html">设置</a></p>
        <p class="text-center">Source Code is available on <a href="https://github.com/kj415j45/octavia">GitHub</a></p>
        <p class="text-center">Powered by <a href="https://workers.cloudflare.com/">Cloudflare Workers</a></p>
    </footer>

    <script src="/lib/bootstrap.bundle.min.js"></script>
    <script>
        const MAX_ENUM_COUNT = 200;

        function escHtml(s) {
            return String(s)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function parseEnumInput(raw) {
            if (!/^\d+$/.test(raw)) {
                return { error: '请输入纯数字的 UID 或奇域 ID' };
            }
            let uid;
            let guidConversion = null;
            try {
                const n = BigInt(raw);
                if ((n >> 32n) === 0n) {
                    uid = Number(n);
                } else {
                    const converted = guidToUid(n);
                    uid = converted.uid;
                    guidConversion = { guid: raw, uid: converted.uid, seq: converted.seq };
                }
            } catch (err) {
                return { error: '无法解析输入的数字' };
            }
            const region = uidToRegion(uid);
            if (!region) {
                return { error: `无法根据 UID ${uid} 判断所属服务器（可能为内部服务器或无效 UID）` };
            }
            const regionName = (regionMap[region] && regionMap[region].name) || region;
            return { uid, region, regionName, guidConversion };
        }

        function updateEnumPreview() {
            const preview = document.getElementById('enumPreview');
            const raw = document.getElementById('enumInput').value.trim();
            if (!raw) {
                preview.className = 'form-text';
                preview.textContent = '';
                return;
            }
            const parsed = parseEnumInput(raw);
            if (parsed.error) {
                preview.className = 'form-text text-danger';
                preview.textContent = parsed.error;
                return;
            }
            preview.className = 'form-text';
            if (parsed.guidConversion) {
                preview.innerHTML = `识别为 guid → UID <strong>${parsed.uid}</strong> · seq <strong>${parsed.guidConversion.seq}</strong> · ${escHtml(parsed.regionName)}`;
            } else {
                preview.innerHTML = `识别为 UID <strong>${parsed.uid}</strong> · ${escHtml(parsed.regionName)}`;
            }
        }

        async function initToolsPage() {
            try {
                await getRegionMap();
            } catch (err) {
                console.warn('Failed to load region map', err);
            }
            updateEnumPreview();
        }

        document.getElementById('enumInput').addEventListener('input', updateEnumPreview);
        initToolsPage();

        window.enumerateAuthorStages = async () => {
            const container = document.getElementById('enumResult');
            const raw = document.getElementById('enumInput').value.trim();
            const seqStart = Number.parseInt(document.getElementById('enumSeqStart').value, 10);
            const seqEnd = Number.parseInt(document.getElementById('enumSeqEnd').value, 10);

            const fail = (msg) => {
                container.innerHTML = `<div class="rounded p-2 result-box text-danger-emphasis bg-danger-subtle border border-danger-subtle">${escHtml(msg)}</div>`;
            };

            const parsed = parseEnumInput(raw);
            if (parsed.error) { fail(parsed.error); return; }
            if (!Number.isInteger(seqStart) || !Number.isInteger(seqEnd) || seqStart < 1 || seqEnd < 1) {
                fail('seq 范围必须为正整数'); return;
            }
            if (seqEnd < seqStart) { fail('seq 结束不能小于起始'); return; }
            if (seqEnd - seqStart + 1 > MAX_ENUM_COUNT) {
                fail(`seq 范围过大，单次最多生成 ${MAX_ENUM_COUNT} 个`); return;
            }

            await getRegionMap();

            const { uid, region, regionName, guidConversion } = parsed;
            const guids = [];
            for (let seq = seqStart; seq <= seqEnd; seq++) {
                guids.push(uidToGuid(uid, seq));
            }

            const params = new URLSearchParams({ stages: guids.join(' '), region });
            const url = `/index.html?${params.toString()}`;
            window.open(url, '_blank', 'noopener');

            const conversionHtml = guidConversion
                ? `<div class="rounded p-2 result-box text-info-emphasis bg-info-subtle border border-info-subtle mb-2">输入识别为 guid <strong>${escHtml(guidConversion.guid)}</strong> → UID <strong>${guidConversion.uid}</strong>，seq <strong>${guidConversion.seq}</strong></div>`
                : '';

            container.innerHTML = `
                ${conversionHtml}
                <div class="rounded p-2 result-box text-success-emphasis bg-success-subtle border border-success-subtle">已为 UID <strong>${uid}</strong>（${escHtml(regionName)}）生成 seq ${seqStart}~${seqEnd} 共 ${guids.length} 个 guid，并在新标签页打开查询。</div>
                <textarea class="form-control font-monospace mt-2" rows="4" readonly>${escHtml(guids.join('\n'))}</textarea>`;
        };
    </script>
</body>
</html>
